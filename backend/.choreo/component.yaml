schemaVersion: 1.2

endpoints:
  - name: inspector-api
    displayName: MCP Inspector API
    service:
      # Root, so /api/v1/*, the CIMD documents under /oauth, and /callback are exposed
      basePath: /
      port: 8080
    type: REST
    # Only the frontend's nginx proxy calls the backend, from inside the project
    networkVisibilities:
      - Project
